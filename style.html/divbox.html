<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.relative{
            border: 5px solid blue ;
            position: relative;
            width: 500px;
            height: 600px;
            left: 300px;
        }
        div.absolute{
            position: absolute;
            border: 5px solid red;
            width: 300px;
            height: 200px;
            left: -310px;
            bottom: -210px;
        }
    </style>
</head>
<body>
    <h1>
        Hello
    </h1>
    <div class="relative">
        Yumiweeeeeeeeeeeeeeeee
        <div class="absolute">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur ullam magni fugit iste dolor soluta labore laboriosam rem praesentium repudiandae?
        </div>
    </div>
</body>
</html>
